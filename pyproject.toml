[project]
name = "report-lineage"
version = "0.1.0"
description = "Count independent sources, not reports, and follow corrections through relays."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["report_lineage"]
